name: Transcript Extract (temp)

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Session ID to read
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKER_SUBDOMAIN }}
      SESSION_ID: ${{ inputs.session_id }}
      CONTROL_PLANE_SCRIPT: open-inspect-control-plane-openinspect-leetsoftware
      READER_NAME: tmp-session-reader
    steps:
      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Generate read token
        id: token
        run: echo "value=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"

      - name: Deploy temp reader worker
        id: deploy
        working-directory: /tmp
        run: |
          mkdir -p reader && cd reader
          cat > worker.js <<'WORKER_EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/read" || url.searchParams.get("t") !== env.READ_TOKEN) {
                return new Response("not found", { status: 404 });
              }
              const kind = url.searchParams.get("kind") || "messages";
              const qp = new URLSearchParams();
              qp.set("limit", url.searchParams.get("limit") || "100");
              const cursor = url.searchParams.get("cursor");
              if (cursor) qp.set("cursor", cursor);
              const sessionId = url.searchParams.get("session");
              const stub = env.SESSION.get(env.SESSION.idFromName(sessionId));
              const resp = await stub.fetch(
                "https://internal.do/internal/" + kind + "?" + qp.toString()
              );
              return new Response(resp.body, {
                status: resp.status,
                headers: { "content-type": "application/json" },
              });
            },
          };
          WORKER_EOF
          cat > wrangler.jsonc <<'CFG_EOF'
          {
            "name": "tmp-session-reader",
            "main": "worker.js",
            "compatibility_date": "2024-09-23",
            "durable_objects": {
              "bindings": [
                {
                  "name": "SESSION",
                  "class_name": "SessionDO",
                  "script_name": "open-inspect-control-plane-openinspect-leetsoftware"
                }
              ]
            }
          }
          CFG_EOF
          npx wrangler deploy --var "READ_TOKEN:${{ steps.token.outputs.value }}" 2>&1 | tee deploy.log
          URL=$(grep -o 'https://tmp-session-reader\.[-a-z0-9.]*\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Fetch transcript
        working-directory: /tmp
        env:
          READER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          export READ_TOKEN="${{ steps.token.outputs.value }}"
          cat > fetch.mjs <<'FETCH_EOF'
          async function page(kind, cursor) {
            const u = new URL(process.env.READER_URL + "/read");
            u.searchParams.set("t", process.env.READ_TOKEN);
            u.searchParams.set("session", process.env.SESSION_ID);
            u.searchParams.set("kind", kind);
            u.searchParams.set("limit", "200");
            if (cursor) u.searchParams.set("cursor", cursor);
            const r = await fetch(u);
            const text = await r.text();
            return { status: r.status, text };
          }
          async function pageRetry(kind, cursor) {
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { status, text } = await page(kind, cursor);
              if (status === 200 || (status >= 400 && status < 500 && !text.includes("workers.cloudflare"))) {
                return { status, text };
              }
              console.log(`attempt ${attempt}: status=${status}, retrying in 10s...`);
              await new Promise((r) => setTimeout(r, 10000));
            }
            return { status: 0, text: "gave up waiting for worker route" };
          }
          for (const kind of ["messages", "events", "snapshot"]) {
            console.log(`===== ${kind} =====`);
            let cursor;
            for (let i = 0; i < 100; i++) {
              const { status, text } = await pageRetry(kind, cursor);
              if (status !== 200) {
                console.log(`status=${status} body=${text.slice(0, 500)}`);
                break;
              }
              console.log(text);
              try {
                const j = JSON.parse(text);
                cursor = j && typeof j === "object" ? j.cursor : undefined;
              } catch {
                break;
              }
              if (!cursor) break;
            }
          }
          FETCH_EOF
          node fetch.mjs

      - name: Delete temp worker
        if: always()
        working-directory: /tmp
        run: npx wrangler delete --name tmp-session-reader --force || true
