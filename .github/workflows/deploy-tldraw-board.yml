name: Deploy tldraw board

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack app
        run: |
          mkdir -p /tmp/app && cd /tmp/app
          echo '' | base64 -d | tar xz

      - name: Build
        working-directory: /tmp/app
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -1
          VITE_TLDRAW_LICENSE="${{ secrets.TLDRAW_LICENSE_KEY }}" npm run build 2>&1 | tail -3

      - name: Deploy worker
        working-directory: /tmp/app
        run: |
          npm i -g wrangler@4 2>&1 | tail -1
          npx wrangler deploy 2>&1 | tee deploy.log
          grep -o 'https://[-a-z0-9.]*workers.dev' deploy.log | head -1 || true
